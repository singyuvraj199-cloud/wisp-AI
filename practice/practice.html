<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>number guissing game</title>
    <link rel="stylesheet" href="practice.css">
</head>
<body>
    <div class="heading">
    <h1>number guesssing game</h1>
    <div class="guess-numbers">
        <span id="number"><h2>guess numbers from 0 to 100<h2></span>
        <div class="write-input">
            <input type="text" id="input" placeholder="guess any number">
            <button class="btn">Guess</button>
        </div>

    </div>
    <div class="count">
        <p>no. of guesses:<span id="count"></span></p> 
        <p>numbers guessed: <span id="guessed"> </span></p>
    </div>
    <p id="result"></p>
    </div>




    <script src="practice.js"></script>
</body>
</html>
